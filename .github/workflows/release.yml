name: Build and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to publish
        required: true
        default: v1.1.0

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Select release tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
          } elseif ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $tag = '${{ inputs.tag }}'
          } else { throw 'Unable to determine the release tag.' }

          git rev-parse --verify "refs/tags/$tag"
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Enable pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Electron runtime
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'node_modules\electron\dist\electron.exe')) {
            node node_modules\electron\install.js
          }
          if (-not (Test-Path -LiteralPath 'node_modules\electron\dist\electron.exe')) {
            throw 'Electron runtime download did not produce electron.exe.'
          }

      - name: Run core test suite
        run: pnpm test

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Scan source and Git history for secrets
        run: pnpm run security:audit -- --source-only

      - name: Build portable and extract-once packages
        run: pnpm run dist -- --publish never

      - name: Scan release artifacts for secrets
        run: pnpm run security:audit

      - name: Create checksums
        shell: pwsh
        run: |
          $artifacts = @(
            Get-ChildItem dist -File -Filter 'DSH-Manager-*-portable.exe'
            Get-ChildItem dist -File -Filter 'DSH-Manager-*-windows-x64.zip'
          )

          if ($artifacts.Count -ne 2) {
            throw "Expected two release artifacts, found $($artifacts.Count)."
          }

          $lines = $artifacts | Sort-Object Name | ForEach-Object {
            $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName
            "$($hash.Hash)  $($_.Name)"
          }
          $lines | Set-Content -LiteralPath dist\SHA256SUMS.txt -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notesPath = ".github/release-notes/$env:RELEASE_TAG.md"
          $assets = @(
            (Get-ChildItem dist -File -Filter 'DSH-Manager-*-portable.exe').FullName
            (Get-ChildItem dist -File -Filter 'DSH-Manager-*-windows-x64.zip').FullName
            (Resolve-Path 'dist\SHA256SUMS.txt').Path
          )
          $title = "DSH Manager $env:RELEASE_TAG"

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            if (Test-Path -LiteralPath $notesPath) {
              gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --title $title --notes-file $notesPath --latest
            }
            gh release upload $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY --clobber
          } elseif (Test-Path -LiteralPath $notesPath) {
            gh release create $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY --verify-tag --title $title --notes-file $notesPath --latest
          } else {
            gh release create $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY --verify-tag --title $title --generate-notes --latest
          }
